name: Add a tool
description: Suggest an AI tool to add to the directory
title: "Add: "
labels: ["new-tool"]
body:
  - type: input
    id: name
    attributes:
      label: Tool name
      placeholder: "Uizard"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Official URL
      placeholder: "https://uizard.io"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Which existing category does this belong in? If none fit, open a "Suggest a category" issue instead.
      options:
        - AI Tools for UI/UX Design & Prototyping
        - AI Tools for Logo & Brand Identity Generation
        - AI Tools for Image Generation & Illustration
        - AI Tools for Presentation & Slide Design
        - AI Tools for Mockup & Product Photography
        - AI Tools for Color Palette & Design Systems
        - AI Tools for Vector Graphics & Icon Generation
        - AI Tools for Video & Motion Design
        - Other / not sure
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: One-line description
      description: Factual, ≤160 characters, no superlatives.
      placeholder: "Turns sketches, screenshots, or text prompts into editable UI mockups and interactive prototypes."
    validations:
      required: true
  - type: dropdown
    id: pricing
    attributes:
      label: Pricing tier
      options:
        - Free
        - Freemium
        - Paid
        - Paid (enterprise/custom pricing)
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure
      options:
        - label: I'm not affiliated with this tool, or I've said so above/below
